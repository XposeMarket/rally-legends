<!doctype html>
<html><head><meta charset="utf-8"><base href="../"><title>world test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;font:12px monospace;color:#fff}#hud{position:fixed;left:8px;top:8px;background:rgba(0,0,0,.5);padding:6px 8px;white-space:pre}</style>
</head><body><div id="hud">loading…</div>
<script type="module">
// Usage: /tools/world-test.html?stage=turini&q=high&s=1200 (s = distance along road to start at, 'stop' freezes camera)
import * as THREE from './js/vendor/three.module.js';
import { loadStage } from './js/stage.js';
import { buildWorld } from './js/world.js';
const qs = new URLSearchParams(location.search);
const id = qs.get('stage') || 'ouninpohja', quality = qs.get('q') || 'high';
const hud = document.getElementById('hud');
window.__errors = [];
addEventListener('error', (e) => { window.__errors.push(String(e.message)); hud.textContent = 'ERROR ' + e.message; });
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.3, 3000);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
try {
  const stage = await loadStage(id);
  const t0 = performance.now();
  const world = await buildWorld(scene, stage, { quality, renderer });
  const ms = performance.now() - t0;
  window.__world = world; window.__stage = stage;
  const car = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.3, 4.1).translate(0, 0.65, 0), new THREE.MeshStandardMaterial({ color: 0x1060d0 }));
  car.castShadow = true; scene.add(car);
  let s = +(qs.get('s') || stage.startS - 20), last = performance.now(), frames = 0, fpsT = 0, fps = 0;
  const stop = qs.has('stop'), p = {}, la = {}, focus = new THREE.Vector3();
  function frame(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (!stop) s += dt * 30; if (s > stage.length - 5) s = 0;
    stage.pointAtS(s, p); stage.pointAtS(s + 14, la);
    const cy = stage.heightAt(p.x, p.z, p.i);
    car.position.set(p.x, cy, p.z); car.rotation.y = Math.atan2(p.tx, p.tz);
    focus.copy(car.position);
    const b = {}; stage.pointAtS(Math.max(0, s - 11), b);
    camera.position.set(b.x, stage.heightAt(b.x, b.z, b.i) + 4.2, b.z);
    camera.lookAt(la.x, stage.heightAt(la.x, la.z, la.i) + 1.0, la.z);
    world.update(dt, camera, focus);
    renderer.render(scene, camera);
    frames++; fpsT += dt; if (fpsT > 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0;
      hud.textContent = `${stage.meta.name} (${id}) env=${stage.meta.env} q=${quality}\nbuild ${ms.toFixed(0)} ms  fps ${fps.toFixed(0)}  s=${s.toFixed(0)}/${stage.length.toFixed(0)}\ninstances ${world.stats.instances} colliders ${world.colliders.length} calls ${renderer.info.render.calls} tris ${(renderer.info.render.triangles / 1000).toFixed(0)}k` + (window.__errors.length ? '\nERR ' + window.__errors.join(' | ') : ''); }
    requestAnimationFrame(frame);
  }
  window.__ready = { ms, instances: world.stats.instances, colliders: world.colliders.length };
  requestAnimationFrame(frame);
} catch (e) { window.__errors.push(String(e.stack || e)); hud.textContent = 'ERROR ' + (e.stack || e); console.error(e); }
</script></body></html>
